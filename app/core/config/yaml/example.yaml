# =========================================================================
# Пример yaml-конфига. Скопируйте в app/core/config/yaml/<env>.yaml
# (dev.yaml / prod.yaml / test.yaml) и отредактируйте под окружение.
#
# YAML имеет САМЫЙ НИЗКИЙ приоритет среди источников настроек — используйте
# его для несекретных дефолтов. Переменные окружения / .env / secrets
# переопределяют эти значения.
#
# ВАЖНО: не храните db.PASSWORD здесь — это поле обязательно и должно
# приходить только из env-переменных или docker/k8s secrets, иначе
# секрет попадёт в git.
# =========================================================================

app:
  TITLE: "AppTitle"
  HOST: "0.0.0.0"
  PORT: 8000
  DEBUG: false
  LOG_LEVEL: "INFO"

db:
  USERNAME: "postgres"
  DATABASE: "restik_db"
  HOST: "localhost"
  PORT: 5432
  DRIVER: "postgresql+asyncpg"
  ECHO: false
  # PASSWORD: НЕ указывать здесь — только через env/secrets
