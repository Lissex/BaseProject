[pytest]
# Запуск от корня проекта, чтобы `import app.*` резолвился как обычно
# (тот же способ, каким его импортирует uvicorn).
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Use-case тесты — async def, без него pytest-asyncio требует
# @pytest.mark.asyncio на каждом тесте.
asyncio_mode = auto