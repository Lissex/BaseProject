[alembic]
# Путь к папке с миграциями (относительно алембика; здесь он равен script_location)
script_location = app/infrastructure/database/alembic

# Шаблон имени файла миграции: дата + revision + slug
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Часовой пояс для file_template
timezone = UTC

prepend_sys_path = .

# sqlalchemy.url НЕ задаём здесь намеренно — реальный URL берётся из
# settings.db.url (app/core/config/settings.py) внутри env.py, чтобы
# не дублировать и не рассинхронизировать конфигурацию БД между
# приложением и Alembic. Если нужно переопределить точечно (напр. в CI),
# используйте переменную окружения ENV, как и для самого приложения.
# sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Опционально: автоформатирование сгенерированных миграций
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S